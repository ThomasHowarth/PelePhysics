# Cite the references below when using it.
species: H2O
aliases: []
composition:
  H: 2
  O: 1
units: 1/(cm bar)
fit:
  variable: x = ln(T / 1000 K)
  form: ln kp = polynomial in x on each range (increasing powers); kp held at its T_low value
    below T_low; kp = kp(T_max) (T / T_max)^exponent above T_max
  T_low: 250.0
  T_max: 5000.0
  ranges:
  - T_min: 250.0
    T_max: 1020.0
    coefficients:
    - -2.9820930240159464
    - -1.9989514509220512
    - -0.32818656598503343
    - -0.9170336424445474
    - -1.7970665088707787
    - -1.5105335478121655
    - -0.41286767374312117
  - T_min: 1020.0
    T_max: 5000.0
    coefficients:
    - -2.9822776428292936
    - -1.9929081029863323
    - -0.17454359459921776
    - -0.3509090877148868
    - 0.11104952342155047
    - 0.06316779682108861
    - -0.030352107975108737
  exponent: -3.2772127104771345
  max_relative_error: 0.000278
source:
  database: ExoMol
  linelist: POKAZATEL
  isotopologue: natural abundance
  linelist_max_temperature: 6000.0
  files:
