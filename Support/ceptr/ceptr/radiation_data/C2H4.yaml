# Planck-mean absorption coefficient kp(T) of C2H4, per unit partial
# pressure, 1/(cm bar): a fit of ln kp to ExoMol data, written by planck-mean
# (Support/ceptr/ceptr/planck_mean.py). convert --radiation writes it into
# mechanism.H.
#
# Licence: derived from the ExoMol database (www.exomol.com) and, like it,
# released under CC BY-SA 4.0 (https://creativecommons.org/licenses/by-sa/4.0/).
# Cite the references below when using it.
species: C2H4
composition:
  C: 2
  H: 4
units: 1/(cm bar)
fit:
  variable: x = ln(T / 1000 K)
  form: ln kp = polynomial in x on each range (increasing powers); kp held at its T_low value
    below T_low; kp = kp(T_max) (T / T_max)^exponent above T_max
  T_low: 300.0
  T_max: 700.0
  ranges:
  - T_min: 300.0
    T_max: 700.0
    coefficients:
    - -3.2508640370633533
    - -1.897979952833966
    - 0.5272614585567749
    - 0.6529914830914009
  exponent: -2.0248869720382188
  max_relative_error: 0.00187
source:
  database: ExoMol
  linelist: MaYTY
  isotopologue: 12C2-1H4
  linelist_max_temperature: 700.0
  files:
  - https://www.exomol.com/db/C2H4/12C2-1H4/MaYTY/12C2-1H4__MaYTY__00000-07100__200K.super.bz2
  - https://www.exomol.com/db/C2H4/12C2-1H4/MaYTY/12C2-1H4__MaYTY__00000-07100__300K.super.bz2
  - https://www.exomol.com/db/C2H4/12C2-1H4/MaYTY/12C2-1H4__MaYTY__00000-07100__400K.super.bz2
  - https://www.exomol.com/db/C2H4/12C2-1H4/MaYTY/12C2-1H4__MaYTY__00000-07100__500K.super.bz2
  - https://www.exomol.com/db/C2H4/12C2-1H4/MaYTY/12C2-1H4__MaYTY__00000-07100__600K.super.bz2
  - https://www.exomol.com/db/C2H4/12C2-1H4/MaYTY/12C2-1H4__MaYTY__00000-07100__700K.super.bz2
licence: CC BY-SA 4.0 (https://creativecommons.org/licenses/by-sa/4.0/)
references:
- 'B. P. Mant, A. Yachmenev, J. Tennyson, S. N. Yurchenko, ExoMol molecular line lists - XXVII:
  spectra of C2H4, Mon. Not. R. Astron. Soc. 478, 3220-3232 (2018), doi:10.1093/mnras/sty1239'
- 'J. Tennyson et al., The ExoMol database: molecular line lists for exoplanet and other hot
