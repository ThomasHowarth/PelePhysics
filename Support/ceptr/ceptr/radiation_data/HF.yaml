# Cite the references below when using it.
species: HF
aliases: []
composition:
  H: 1
  F: 1
units: 1/(cm bar)
fit:
  variable: x = ln(T / 1000 K)
  form: ln kp = polynomial in x on each range (increasing powers); kp held at its T_low value
    below T_low; kp = kp(T_max) (T / T_max)^exponent above T_max
  T_low: 250.0
  T_max: 5000.0
  ranges:
  - T_min: 250.0
    T_max: 930.0
    coefficients:
    - -3.443429159756387
    - -1.254570096467578
    - -1.4819313980127191
    - -8.114914072760083
    - -10.032363387230342
    - -5.325438909926971
    - -1.0645559052678832
  - T_min: 930.0
    T_max: 5000.0
    coefficients:
    - -3.43559182055886
    - -1.0611573520439321
    - 0.07772275024027897
    - -2.0124578702022893
    - 1.7331832537235046
    - -0.6808157661593571
    - 0.10681259026123743
  exponent: -3.4669822335575082
  max_relative_error: 0.000522
source:
  database: ExoMol
  linelist: Coxon-Hajig
  isotopologue: 1H-19F
  linelist_max_temperature: 5000.0
