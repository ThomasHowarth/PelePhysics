# Planck-mean absorption coefficient kp(T) of OH, per unit partial
# pressure, 1/(cm bar): a fit of ln kp to ExoMol data, written by planck-mean
# (Support/ceptr/ceptr/planck_mean.py). convert --radiation writes it into
# mechanism.H.
#
# Licence: derived from the ExoMol database (www.exomol.com) and, like it,
# released under CC BY-SA 4.0 (https://creativecommons.org/licenses/by-sa/4.0/).
# Cite the references below when using it.
species: OH
composition:
  O: 1
  H: 1
units: 1/(cm bar)
fit:
  variable: x = ln(T / 1000 K)
  form: ln kp = polynomial in x on each range (increasing powers); kp held at its T_low value
    below T_low; kp = kp(T_max) (T / T_max)^exponent above T_max
  T_low: 250.0
  T_max: 5000.0
  ranges:
  - T_min: 250.0
    T_max: 2700.0
    coefficients:
    - -4.333693083767965
    - -2.3752240840503704
    - 0.2171935602098025
    - -0.377382531311943
    - -0.2315117278154093
    - 0.1767475041349368
    - 0.11350430314632456
  - T_min: 2700.0
    T_max: 5000.0
    coefficients:
    - -257.1656361945971
    - 965.6703615244796
    - -1418.9227453386366
    - 958.4745419112253
    - -257.6272608428526
    - -8.788601201832158
    - 11.552923787656272
  exponent: 0.0
  max_relative_error: 0.00413
source:
  database: ExoMol
  linelist: MYTHOS
  isotopologue: 16O-1H
  linelist_max_temperature: 10000.0
  files:
  - https://www.exomol.com/db/OH/16O-1H/MYTHOS/16O-1H__MYTHOS.cf
licence: CC BY-SA 4.0 (https://creativecommons.org/licenses/by-sa/4.0/)
references:
- G. B. Mitev, C. A. Bowesman, J. Zhang, S. N. Yurchenko, J. Tennyson, ExoMol line lists -
  LXI. A trihybrid line list for rovibronic transitions of the hydroxyl radical (OH), Mon.
  Not. R. Astron. Soc. 536, 3401-3420 (2025), doi:10.1093/mnras/stae2803
- 'J. Tennyson et al., The ExoMol database: molecular line lists for exoplanet and other hot
  atmospheres, J. Mol. Spectrosc. 327, 73-94 (2016), doi:10.1016/j.jms.2016.05.002'
- 'S. N. Yurchenko, A. F. Al-Refaie, J. Tennyson, ExoCross: a general program for generating
  spectra from molecular line lists, Astron. Astrophys. 614, A131 (2018), doi:10.1051/0004-6361/201732531'
