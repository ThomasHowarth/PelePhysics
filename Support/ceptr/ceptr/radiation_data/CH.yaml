# Planck-mean absorption coefficient kp(T) of CH, per unit partial
# pressure, 1/(cm bar): a fit of ln kp to ExoMol data, written by planck-mean
# (Support/ceptr/ceptr/planck_mean.py). convert --radiation writes it into
# mechanism.H.
#
# Licence: derived from the ExoMol database (www.exomol.com) and, like it,
# released under CC BY-SA 4.0 (https://creativecommons.org/licenses/by-sa/4.0/).
# Cite the references below when using it.
species: CH
composition:
  C: 1
  H: 1
units: 1/(cm bar)
fit:
  variable: x = ln(T / 1000 K)
  form: ln kp = polynomial in x on each range (increasing powers); kp held at its T_low value
    below T_low; kp = kp(T_max) (T / T_max)^exponent above T_max
  T_low: 250.0
  T_max: 5000.0
  ranges:
  - T_min: 250.0
    T_max: 1000.0
    coefficients:
    - -3.0825231999063094
    - -5.000000000000058
    - -1.6897886487006007e-13
    - -2.0411891319094489e-13
    - -1.0017493964575652e-13
    - -4.714723645108404e-15
    - 7.643384364495132e-15
  - T_min: 1000.0
    T_max: 2220.0
    coefficients:
    - -3.0825231999063094
    - -0.8262654296375727
    - -2.1109752792084384
    - 0.2838825241378984
    - 6.331551309255676
    - -17.087641799632365
    - 14.457582150065655
  - T_min: 2220.0
    T_max: 5000.0
    coefficients:
    - 101.98848360847806
    - -487.2823340817031
    - 896.1656625072553
    - -855.7023297573221
    - 455.19283595348327
    - -128.68120307833826
    - 15.119177279269186
  exponent: 0.0
  max_relative_error: 0.00355
source:
  database: ExoMol
  linelist: MoLLIST
  isotopologue: 12C-1H
  linelist_max_temperature: 8000.0
  files:
  - https://www.exomol.com/db/CH/12C-1H/MoLLIST/12C-1H__MoLLIST.cf
