# Planck-mean absorption coefficient kp(T) of CH4, per unit partial
# pressure, 1/(cm bar): a fit of ln kp to ExoMol data, written by planck-mean
# (Support/ceptr/ceptr/planck_mean.py). convert --radiation writes it into
# mechanism.H.
#
# Licence: derived from the ExoMol database (www.exomol.com) and, like it,
# released under CC BY-SA 4.0 (https://creativecommons.org/licenses/by-sa/4.0/).
# Cite the references below when using it.
species: CH4
aliases: []
composition:
  C: 1
  H: 4
units: 1/(cm bar)
fit:
  variable: x = ln(T / 1000 K)
  form: ln kp = polynomial in x on each range (increasing powers); kp held at its T_low value
    below T_low; kp = kp(T_max) (T / T_max)^exponent above T_max
  T_low: 250.0
  T_max: 2000.0
  ranges:
  - T_min: 250.0
    T_max: 780.0
    coefficients:
    - -3.477593009542353
    - -1.5087920880797105
    - -2.2948069615637614
    - -1.8362898423778562
    - 0.3035127783375795
    - 1.2759212100568702
    - 0.3932855738895615
  - T_min: 780.0
    T_max: 2000.0
    coefficients:
    - -3.4430378605097327
    - -1.1707922383927034
    - -1.1518294831828675
    - -0.48457348033366554
    - -0.37578267757584566
    - -0.864461372162532
    - 1.074914582113735
  exponent: -3.932395637208734
  max_relative_error: 0.000374
source:
  database: ExoMol
  linelist: MM
  isotopologue: 12C-1H4
  linelist_max_temperature: 2000.0
  files:
  - https://www.exomol.com/db/CH4/12C-1H4/MM/12C-1H4__MM.cf
licence: CC BY-SA 4.0 (https://creativecommons.org/licenses/by-sa/4.0/)
references:
- 'S. N. Yurchenko, A. Owens, K. Kefala, J. Tennyson, ExoMol line lists - LVII: High accuracy
  ro-vibrational line list for methane (CH4), Mon. Not. R. Astron. Soc. 528, 3719-3729 (2024),
  doi:10.1093/mnras/stae148'
- 'J. Tennyson et al., The ExoMol database: molecular line lists for exoplanet and other hot
  atmospheres, J. Mol. Spectrosc. 327, 73-94 (2016), doi:10.1016/j.jms.2016.05.002'
- 'S. N. Yurchenko, A. F. Al-Refaie, J. Tennyson, ExoCross: a general program for generating
  spectra from molecular line lists, Astron. Astrophys. 614, A131 (2018), doi:10.1051/0004-6361/201732531'
