# Planck-mean absorption coefficient kp(T) of CN, per unit partial
# pressure, 1/(cm bar): a fit of ln kp to ExoMol data, written by planck-mean
# (Support/ceptr/ceptr/planck_mean.py). convert --radiation writes it into
# mechanism.H.
#
# Licence: derived from the ExoMol database (www.exomol.com) and, like it,
# released under CC BY-SA 4.0 (https://creativecommons.org/licenses/by-sa/4.0/).
# Cite the references below when using it.
species: CN
composition:
  C: 1
  N: 1
units: 1/(cm bar)
fit:
  variable: x = ln(T / 1000 K)
  form: ln kp = polynomial in x on each range (increasing powers); kp held at its T_low value
    below T_low; kp = kp(T_max) (T / T_max)^exponent above T_max
  T_low: 250.0
  T_max: 5000.0
  ranges:
  - T_min: 250.0
    T_max: 720.0
    coefficients:
    - -4.489555469524355
    - -1.2786475404385593
    - -4.923087332998006
    - -13.815770388976613
    - -19.251301004639487
    - -10.791851753480914
    - -1.9519768302129743
  - T_min: 720.0
    T_max: 1660.0
    coefficients:
    - -3.4964309747964735
    - 5.438475757872442
    - 5.124114488727228
    - -20.90558373932232
    - 1.560470609610145
    - 63.1852826409386
    - -66.76988147033272
  - T_min: 1660.0
    T_max: 5000.0
    coefficients:
    - -3.944880123120649
    - 9.984682870806905
    - -14.002834231570521
    - 17.202223228800005
    - -16.125446881783404
    - 8.109208691027582
    - -1.5696450459355882
  exponent: 0.0
  max_relative_error: 0.00369
source:
  database: ExoMol
  linelist: KTPSYT
  isotopologue: 12C-14N
  linelist_max_temperature: 10000.0
  files:
  - https://www.exomol.com/db/CN/12C-14N/KTPSYT/12C-14N__KTPSYT.cf
